<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up / Log In - orbbt.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    :root { --bg:#fbfaf6; --paper:#fff; --ink:#111; --muted:#6d6a64; --soft:#a6a19a; --line:#e8e2d8; --violet:#5b24ff; --max:980px; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased; }
    body::before { content:""; position:fixed; right:10%; bottom:12%; width:220px; height:220px; border-radius:50%; background:rgba(91,36,255,.06); filter:blur(12px); animation:breathe 7s ease-in-out infinite; pointer-events:none; }
    a { color:inherit; }
    img { max-width:100%; display:block; }
    button, input { font:inherit; }
    .wrap { width:min(var(--max), calc(100% - 40px)); margin:0 auto; }
    .topbar { border-bottom:1px solid var(--line); background:rgba(251,250,246,.86); backdrop-filter:blur(16px); }
    .nav { min-height:64px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { display:inline-flex; align-items:center; gap:9px; text-decoration:none; font-size:18px; font-weight:700; line-height:1; }
    .brand img { width:32px; height:32px; object-fit:contain; }
    .nav-links { display:flex; gap:18px; color:var(--muted); font-size:13px; font-weight:600; }
    .nav-links a { text-decoration:none; }
    .btn { display:inline-flex; align-items:center; justify-content:center; min-height:38px; padding:9px 15px; border:1px solid var(--line); border-radius:999px; background:var(--paper); color:var(--ink); text-decoration:none; font-size:13px; font-weight:700; cursor:pointer; }
    .btn.primary { border-color:var(--violet); background:var(--violet); color:#fff; }
    main { min-height:calc(100vh - 65px); display:grid; align-items:center; padding:72px 0; }
    .grid { display:grid; grid-template-columns:1fr 360px; gap:88px; align-items:start; }
    .label { margin-bottom:12px; color:var(--soft); font-family:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:0 0 18px; max-width:560px; font-size:clamp(36px,5vw,58px); line-height:1; letter-spacing:-.04em; }
    p { margin:0; color:var(--muted); }
    .panel { padding:24px; border:1px solid var(--line); background:var(--paper); }
    .tabs { display:flex; gap:8px; margin-bottom:16px; }
    .tab { min-height:34px; padding:7px 13px; border:1px solid var(--line); border-radius:999px; background:var(--paper); color:var(--muted); font-size:12px; font-weight:700; cursor:pointer; }
    .tab.active { border-color:var(--ink); background:var(--ink); color:#fff; }
    form { display:none; gap:12px; }
    form.active { display:grid; }
    label { display:grid; gap:6px; color:var(--muted); font-size:12px; font-weight:700; }
    input { width:100%; border:1px solid var(--line); background:#fff; color:var(--ink); padding:11px 12px; outline:none; font-size:14px; }
    input:focus { border-color:var(--violet); }
    .note { margin-top:16px; color:var(--soft); font-size:12px; font-weight:600; }
    @keyframes breathe { 0%,100%{ transform:scale(.86); opacity:.45; } 50%{ transform:scale(1.06) translateY(-16px); opacity:.8; } }
    @media (max-width:760px) { .grid { grid-template-columns:1fr; gap:38px; } .nav-links { display:none; } main { padding:54px 0; } }
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="wrap nav" aria-label="Primary navigation">
      <a class="brand" href="index.html"><img src="orbbt-logo.png" alt="orbbt. logo"><span>orbbt.</span></a>
      <div class="nav-links">
        <a href="index.html#features">Features</a>
        <a href="index.html#pricing">Pricing</a>
        <a href="waitlist.html">Mobile app waitlist</a>
      </div>
      <a class="btn" href="index.html">Back home</a>
    </nav>
  </header>

  <main>
    <div class="wrap grid">
      <div>
        <div class="label">Account</div>
        <h1>Start organizing your job hunt.</h1>
        <p>Create an account or log back in. This page is ready for your auth backend when the product connects.</p>
      </div>

      <div class="panel">
        <div class="tabs" role="tablist" aria-label="Account tabs">
          <button class="tab active" type="button" data-tab="signup">Sign up</button>
          <button class="tab" type="button" data-tab="login">Log in</button>
        </div>

        <form class="active" id="signup">
          <label>Name<input type="text" placeholder="Your name"></label>
          <label>Email<input type="email" placeholder="you@example.com"></label>
          <label>Password<input type="password" placeholder="Create a password"></label>
          <button class="btn primary" type="submit">Create account</button>
        </form>

        <form id="login">
          <label>Email<input type="email" placeholder="you@example.com"></label>
          <label>Password<input type="password" placeholder="Your password"></label>
          <button class="btn primary" type="submit">Log in</button>
        </form>

        <p class="note">Looking for early access instead? <a href="waitlist.html">Join the waitlist</a>.</p>
      </div>
    </div>
  </main>

  <script>
    const tabs = document.querySelectorAll(".tab");
    const signup = document.getElementById("signup");
    const login = document.getElementById("login");
    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        tabs.forEach((item) => item.classList.toggle("active", item === tab));
        signup.classList.toggle("active", tab.dataset.tab === "signup");
        login.classList.toggle("active", tab.dataset.tab === "login");
      });
    });
    document.querySelectorAll("form").forEach((form) => {
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        let note = form.querySelector(".form-note");
        if (!note) {
          note = document.createElement("p");
          note.className = "form-note";
          note.style.margin = "2px 0 0";
          note.style.color = "#5b24ff";
          note.style.fontSize = "13px";
          note.style.fontWeight = "700";
          form.appendChild(note);
        }
        note.textContent = "Saved for demo. Connect this form to your backend later.";
      });
    });
  </script>
</body>
</html>
