<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile App Waitlist - orbbt.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing:border-box; }
    :root { --bg:#fbfaf6; --paper:#fff; --ink:#111; --muted:#6d6a64; --soft:#a6a19a; --line:#e8e2d8; --violet:#5b24ff; --max:980px; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased; }
    a { color:inherit; }
    img { max-width:100%; display:block; }
    button,input { font:inherit; }
    .wrap { width:min(var(--max), calc(100% - 40px)); margin:0 auto; }
    .topbar { border-bottom:1px solid var(--line); background:rgba(251,250,246,.86); backdrop-filter:blur(16px); }
    .nav { min-height:64px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { display:inline-flex; align-items:center; gap:9px; text-decoration:none; font-size:18px; font-weight:700; line-height:1.05; }
    .brand img { width:32px; height:32px; object-fit:contain; }
    .brand-copy { display:grid; gap:2px; }
    .brand-name { font-size:18px; font-weight:800; }
    .brand-sub { color:var(--soft); font-size:10px; font-weight:700; text-transform:uppercase; }
    .nav-links { display:flex; gap:18px; color:var(--muted); font-size:13px; font-weight:600; }
    .nav-links a { text-decoration:none; }
    .btn { display:inline-flex; align-items:center; justify-content:center; min-height:38px; padding:9px 15px; border:1px solid var(--line); border-radius:999px; background:var(--paper); color:var(--ink); text-decoration:none; font-size:13px; font-weight:700; cursor:pointer; }
    .btn.primary { border-color:var(--violet); background:var(--violet); color:#fff; }
    main { min-height:calc(100vh - 65px); display:grid; align-items:center; padding:72px 0; }
    .grid { display:grid; grid-template-columns:1fr 360px; gap:88px; align-items:start; }
    .label { margin-bottom:12px; color:var(--soft); font-family:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:0 0 18px; max-width:560px; font-size:clamp(36px,5vw,58px); line-height:1; letter-spacing:0; }
    p { margin:0; color:var(--muted); }
    .orbit { position:relative; width:210px; height:210px; margin-top:38px; border:1px solid var(--line); border-radius:50%; animation:pulse 6s ease-in-out infinite; }
    .orbit img { position:absolute; inset:50%; width:86px; height:86px; transform:translate(-50%,-50%); border-radius:50%; box-shadow:0 18px 55px rgba(91,36,255,.18); animation:float 4.5s ease-in-out infinite; }
    .chip { position:absolute; padding:7px 10px; border:1px solid var(--line); border-radius:999px; background:rgba(255,255,255,.86); color:var(--muted); font-size:12px; font-weight:700; animation:float 5.5s ease-in-out infinite; }
    .chip.one { top:12px; right:-16px; }
    .chip.two { left:-20px; bottom:30px; animation-delay:-2s; }
    form { display:grid; gap:12px; padding:24px; border:1px solid var(--line); background:var(--paper); }
    label { display:grid; gap:6px; color:var(--muted); font-size:12px; font-weight:700; }
    input { width:100%; border:1px solid var(--line); background:#fff; color:var(--ink); padding:11px 12px; outline:none; font-size:14px; }
    input:focus { border-color:var(--violet); }
    @keyframes float { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8px); } }
    @keyframes pulse { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.04); } }
    @media (max-width:760px) { .grid{ grid-template-columns:1fr; gap:38px; } .nav-links{ display:none; } main{ padding:54px 0; } }
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="wrap nav" aria-label="Primary navigation">
      <a class="brand" href="index.html"><img src="orbbt-logo.png" alt="orbbt. logo"><span class="brand-copy"><span class="brand-name">orbbt.</span><span class="brand-sub">by zyntro</span></span></a>
      <div class="nav-links">
        <a href="index.html#features">Features</a>
        <a href="index.html#pricing">Pricing</a>
        <a href="auth.html">Log in</a>
      </div>
      <a class="btn" href="index.html">Back home</a>
    </nav>
  </header>

  <main>
    <div class="wrap grid">
      <div>
        <div class="label">Mobile app waitlist</div>
        <h1>Get early access to the orbbt. mobile app.</h1>
        <p>Join the App Store and Play Store waitlist. We will invite you when the next mobile early-access wave opens.</p>
        <div class="orbit" aria-hidden="true">
          <img src="orbbt-logo.png" alt="">
          <span class="chip one">App Store</span>
          <span class="chip two">Play Store</span>
        </div>
      </div>

      <form>
        <label>Name<input type="text" placeholder="Your name" required></label>
        <label>Email<input type="email" placeholder="you@example.com" required></label>
        <label>What describes you?<input type="text" placeholder="Student, graduate, career switcher..."></label>
        <button class="btn primary" type="submit">Join mobile app waitlist</button>
      </form>
    </div>
  </main>

  <script>
    document.querySelector("form").addEventListener("submit", (event) => {
      event.preventDefault();
      let note = document.querySelector(".form-note");
      if (!note) {
        note = document.createElement("p");
        note.className = "form-note";
        note.style.color = "#5b24ff";
        note.style.fontSize = "13px";
        note.style.fontWeight = "700";
        event.target.appendChild(note);
      }
      note.textContent = "Saved for demo. Connect this form to your waitlist backend later.";
    });
  </script>
</body>
</html>
